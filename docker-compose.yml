services:
  sentinelmesh:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelmesh:latest
    container_name: sentinelmesh_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
      # - GEMINI_API_KEY=your_key_here
      # - OPENAI_API_KEY=your_key_here
    volumes:
      - sentinelmesh_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

volumes:
  sentinelmesh_data:
    driver: local
